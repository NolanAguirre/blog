# Standalone, rootless nginx config that fronts the local blog tool.
#
# Run it (from anywhere) with the sibling Makefile, or directly:
#   nginx -p services/nginx -c nginx.conf
#
# All relative paths below resolve against the prefix passed via `-p`.
#
#   http://127.0.0.1:6360/        -> repo root static site
#   http://127.0.0.1:6360/admin/  -> ui/blog (Vite on :6302)
#   http://127.0.0.1:6360/api/    -> services/blog (:6300)
#   http://127.0.0.1:6360/auth/   -> services/auth (:6301)

worker_processes 1;
pid nginx.pid;
daemon off;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;

    # Keep every writable path inside the prefix so nginx needs no root.
    client_body_temp_path tmp/client_body;
    proxy_temp_path        tmp/proxy;
    fastcgi_temp_path      tmp/fastcgi;
    uwsgi_temp_path        tmp/uwsgi;
    scgi_temp_path         tmp/scgi;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    upstream blog_api {
        server 127.0.0.1:6300;
    }
    upstream auth_api {
        server 127.0.0.1:6301;
    }
    upstream blog_ui {
        server 127.0.0.1:6302;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:6360;
        server_name localhost;

        location /api/ {
            proxy_pass http://blog_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://auth_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin {
            return 302 /admin/;
        }

        location /admin/ {
            proxy_pass http://blog_ui;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            root ../..;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
