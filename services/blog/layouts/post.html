<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
{{{header}}}

  <main>
    <article class="content">
      <header class="post-header">
        <h1>{{title}}</h1>
        <div class="post-meta">
          <a href="{{categoryHref}}" class="post-category">{{categoryName}}</a>

      <div class="post-content">
{{{bodyHtml}}}
      </div>
    </article>
  </main>

{{{footer}}}
</body>
</html>
